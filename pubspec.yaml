name: academia_flow
description: Organizador universitario academico offline em Flutter.
publish_to: "none"
version: 2.6.4+23

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^12.0.0
  image_picker: ^1.1.2
  open_filex: ^4.6.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
