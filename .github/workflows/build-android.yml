name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACADEMIA_FLOW_KEYSTORE_B64: ${{ secrets.ACADEMIA_FLOW_KEYSTORE_B64 }}
      ACADEMIA_FLOW_STORE_PASSWORD: ${{ secrets.ACADEMIA_FLOW_STORE_PASSWORD }}
      ACADEMIA_FLOW_KEY_PASSWORD: ${{ secrets.ACADEMIA_FLOW_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Prepare Android signing
        shell: bash
        run: |
          if [[ -n "$ACADEMIA_FLOW_KEYSTORE_B64" && -n "$ACADEMIA_FLOW_STORE_PASSWORD" && -n "$ACADEMIA_FLOW_KEY_PASSWORD" ]]; then
            printf '%s' "$ACADEMIA_FLOW_KEYSTORE_B64" | base64 --decode > android/app/academia-flow-upload.jks
            echo "ACADEMIA_FLOW_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Assinatura release carregada a partir de GitHub Actions Secrets."
          else
            echo "ACADEMIA_FLOW_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Secrets de assinatura não configurados. O CI gerará um APK release instalável usando a assinatura de desenvolvimento criada pelo Flutter. Para releases atualizáveis, configure ACADEMIA_FLOW_KEYSTORE_B64, ACADEMIA_FLOW_STORE_PASSWORD e ACADEMIA_FLOW_KEY_PASSWORD."
          fi

      - name: Validate release signing key
        if: env.ACADEMIA_FLOW_RELEASE_SIGNING == 'true'
        run: |
          keytool -list \
            -keystore android/app/academia-flow-upload.jks \
            -storepass "$ACADEMIA_FLOW_STORE_PASSWORD" \
            -alias academiaflow >/dev/null
          echo "Keystore release validado."

      - name: Install Android icon tooling
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Apply Android configuration
        run: python3 tool/patch_android.py

      - name: Verify Android launcher resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          base = Path('android/app/src/main/res')
          expected = {
              'mipmap-mdpi/ic_launcher.png': (48, 48),
              'mipmap-hdpi/ic_launcher.png': (72, 72),
              'mipmap-xhdpi/ic_launcher.png': (96, 96),
              'mipmap-xxhdpi/ic_launcher.png': (144, 144),
              'mipmap-xxxhdpi/ic_launcher.png': (192, 192),
          }
          for relative, size in expected.items():
              path = base / relative
              if not path.exists():
                  raise SystemExit(f'Recurso ausente: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'Tamanho incorreto em {path}: {image.size} != {size}')

          for relative in (
              'mipmap-anydpi-v26/ic_launcher.xml',
              'mipmap-anydpi-v26/ic_launcher_round.xml',
              'drawable/ic_stat_academia_flow.xml',
          ):
              if not (base / relative).exists():
                  raise SystemExit(f'Recurso ausente: {base / relative}')

          print('Launcher Android e ícone de notificação validados.')
          PY

      - name: Apply Google Android configuration
        run: python3 tool/patch_google_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_ANDROID_SERVER_CLIENT_ID="364193251767-bo6ss1b4eurmv7a06it7f9e40vunjecj.apps.googleusercontent.com"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: academia-flow-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
