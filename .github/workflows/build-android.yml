name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Restore persistent signing key
        run: base64 -d .github/signing/academia-flow.jks.b64 > android/app/academia-flow-upload.jks

      - name: Apply Android configuration
        run: python3 tool/patch_android.py

      - name: Apply Google Android configuration
        run: python3 tool/patch_google_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_ANDROID_SERVER_CLIENT_ID="$GOOGLE_ANDROID_SERVER_CLIENT_ID"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: academia-flow-v2.5-google-integration-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
