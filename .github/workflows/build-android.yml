# Academia Flow v2.5.6 — launcher PNG nativo
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Restore persistent signing key
        run: base64 -d .github/signing/academia-flow.jks.b64 > android/app/academia-flow-upload.jks

      - name: Install Android icon tooling
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Apply Android configuration
        run: python3 tool/patch_android.py

      - name: Verify Android launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          file android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -q 'PNG image data'
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Apply Google Android configuration
        run: python3 tool/patch_google_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_ANDROID_SERVER_CLIENT_ID="364193251767-bo6ss1b4eurmv7a06it7f9e40vunjecj.apps.googleusercontent.com"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: academia-flow-v2.5.6-native-icon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
