name: One-shot final context cleanup

on:
  push:
    branches: [fix/polimento-p0-p2]
    paths:
      - '.github/run-final-context-cleanup.trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polimento-p0-p2

      - name: Fix remaining BuildContext analyzer findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Library: handle delete before any awaited action, so context is never reused after an async gap.
          replace_once(
              'lib/screens/library_screen.dart',
              "                          if (value == 'pin') {",
              "                          if (value == 'delete') {\n                            if (await confirmDelete(context, note.title)) await state.deleteNote(note);\n                            return;\n                          }\n                          if (value == 'pin') {",
          )
          replace_once(
              'lib/screens/library_screen.dart',
              "                          if (!context.mounted) return;\n                          if (value == 'delete' && await confirmDelete(context, note.title)) await state.deleteNote(note);\n",
              "",
          )

          replace_once(
              'lib/screens/library_screen.dart',
              "                    if (value == 'edit') await showMaterialEditor(context, state, material: material);",
              "                    if (value == 'delete') {\n                      if (await confirmDelete(context, material.title)) await state.deleteMaterial(material);\n                      return;\n                    }\n                    if (value == 'edit') await showMaterialEditor(context, state, material: material);",
          )
          replace_once(
              'lib/screens/library_screen.dart',
              "                    if (!context.mounted) return;\n                    if (value == 'delete' && await confirmDelete(context, material.title)) await state.deleteMaterial(material);\n",
              "",
          )

          # Tasks: same ordering; deletion owns the context before any other awaited operation.
          replace_once(
              'lib/screens/tasks_screen.dart',
              "                  if (value == 'edit') await showTaskEditor(context, widget.state, task: task);",
              "                  if (value == 'delete') {\n                    if (await confirmDelete(context, task.title)) await widget.state.deleteTask(task);\n                    return;\n                  }\n                  if (value == 'edit') await showTaskEditor(context, widget.state, task: task);",
          )
          replace_once(
              'lib/screens/tasks_screen.dart',
              "                  if (!mounted) return;\n                  if (value == 'delete' && await confirmDelete(context, task.title)) await widget.state.deleteTask(task);\n",
              "",
          )

          print('Remaining BuildContext findings fixed.')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/library_screen.dart lib/screens/tasks_screen.dart
          git commit -m "fix: resolve final BuildContext analyzer findings"
          git push origin HEAD:fix/polimento-p0-p2
