name: One-shot dedupe polish patch

on:
  push:
    branches: [fix/polimento-p0-p2]
    paths:
      - '.github/run-polish-dedupe-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polimento-p0-p2

      - name: Apply stable dedupe keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'lib/state/app_state.dart',
              "  }) async {\n    final previous = _taskById(item.id);\n    if (item.id != null && item.sessionId == null && previous?.sessionId != null) {",
              "  }) async {\n    final createKey = item.id == null\n        ? 'task:${item.title}|${item.subjectId}|${item.dueDate.toIso8601String()}|${item.priority.index}|${item.status.index}|${item.kind.index}|${item.reminderEnabled}|${item.description}|${item.checklist.join('\\u001F')}|${item.sessionId}'\n        : null;\n    final previous = _taskById(item.id);\n    if (item.id != null && item.sessionId == null && previous?.sessionId != null) {",
          )
          replace_once(
              'lib/state/app_state.dart',
              "    final saved = item.id == null\n        ? await _runCreateOnce('task:${item.toMap()}', () => _db.saveTask(item))",
              "    final saved = item.id == null\n        ? await _runCreateOnce(createKey!, () => _db.saveTask(item))",
          )

          replace_once(
              'lib/state/app_state.dart',
              "  Future<ClassSession> saveClassSession(ClassSession item) async {\n    _validateSchedule(item.date.weekday, item.start, item.end);\n    final saved = item.id == null\n        ? await _runCreateOnce('session:${item.toMap()}', () => _db.saveClassSession(item))",
              "  Future<ClassSession> saveClassSession(ClassSession item) async {\n    _validateSchedule(item.date.weekday, item.start, item.end);\n    final createKey = 'session:${item.subjectId}|${item.scheduleId}|${_dateKey(item.date)}|${item.start}|${item.end}|${item.room}|${item.classCount}|${item.kind.index}|${item.makeupForSessionId}';\n    final saved = item.id == null\n        ? await _runCreateOnce(createKey, () => _db.saveClassSession(item))",
          )

          replace_once(
              'lib/state/app_state.dart',
              "    final v = item.id == null\n        ? await _runCreateOnce('note:${item.toMap()}', () => _db.saveNote(item))",
              "    final createKey = 'note:${item.subjectId}|${item.title}|${item.content}|${item.link}|${item.tags}|${item.pinned}|${item.sessionId}';\n    final v = item.id == null\n        ? await _runCreateOnce(createKey, () => _db.saveNote(item))",
          )
          replace_once(
              'lib/state/app_state.dart',
              "    final v = item.id == null\n        ? await _runCreateOnce('material:${item.toMap()}', () => _db.saveMaterial(item))",
              "    final createKey = 'material:${item.subjectId}|${item.title}|${item.url}|${item.description}|${item.kind.index}|${item.sessionId}';\n    final v = item.id == null\n        ? await _runCreateOnce(createKey, () => _db.saveMaterial(item))",
          )

          replace_once(
              'lib/state/v26_controller.dart',
              "  List<StudyBlock> studyBlocks = [];\n  Set<String> dismissedInsights = <String>{};",
              "  List<StudyBlock> studyBlocks = [];\n  Set<String> dismissedInsights = <String>{};\n  final Map<String, Future<StudyBlock>> _pendingStudyCreates = {};",
          )
          replace_once(
              'lib/state/v26_controller.dart',
              "  }) async {\n    final block = StudyBlock(\n      id: existing?.id ?? 'sb-${DateTime.now().microsecondsSinceEpoch}',",
              "  }) async {\n    final createKey = existing == null\n        ? '${title.trim()}|${startsAt.toIso8601String()}|$subjectId|$durationMinutes|${note.trim()}'\n        : null;\n    final pending = createKey == null ? null : _pendingStudyCreates[createKey];\n    if (pending != null) return pending;\n\n    final block = StudyBlock(\n      id: existing?.id ?? 'sb-${DateTime.now().microsecondsSinceEpoch}',",
          )
          replace_once(
              'lib/state/v26_controller.dart',
              "    _sortBlocks();\n    await _persistStudyBlocks();\n    notifyListeners();\n    return block;\n  }",
              "    final operation = () async {\n      _sortBlocks();\n      await _persistStudyBlocks();\n      notifyListeners();\n      return block;\n    }();\n    if (createKey != null) _pendingStudyCreates[createKey] = operation;\n    try {\n      return await operation;\n    } finally {\n      if (createKey != null && identical(_pendingStudyCreates[createKey], operation)) {\n        _pendingStudyCreates.remove(createKey);\n      }\n    }\n  }",
          )
          replace_once(
              'lib/state/v26_controller.dart',
              "    studyBlocks = [];\n    dismissedInsights = <String>{};\n    notifyListeners();",
              "    studyBlocks = [];\n    dismissedInsights = <String>{};\n    _pendingStudyCreates.clear();\n    notifyListeners();",
          )

          print('Stable dedupe keys applied.')
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "fix: close concurrent create edge cases"
          git push origin HEAD:fix/polimento-p0-p2
