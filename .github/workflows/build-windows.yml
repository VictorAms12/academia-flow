name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows project files
        run: flutter create . --platforms=windows

      - name: Apply desktop branding
        shell: pwsh
        run: |
          $main = Get-Content windows/runner/main.cpp -Raw
          $main = $main.Replace('L"academia_flow"', 'L"Academia Flow"')
          Set-Content windows/runner/main.cpp $main

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --dart-define=GOOGLE_DESKTOP_CLIENT_ID="364193251767-1nnk8nqgdd1u1u93j5gnf9eevt4j5gka.apps.googleusercontent.com"

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath academia-flow-windows-v2.5-google-integration.zip -Force

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: academia-flow-windows-v2.5-google-integration
          path: academia-flow-windows-v2.5-google-integration.zip
          if-no-files-found: error
          retention-days: 30
